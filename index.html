<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" id="meta-theme" content="#F7F5F0">
<title>Быстрые смены — подработка в твоём городе</title>
<meta name="description" content="Быстрые смены — подработка рядом с домом: курьеры, склады, грузчики, кухня. Актуальные предложения в вашем городе.">

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon192.png">
<link rel="apple-touch-icon" href="icon192.png">

<!-- Анти-вспышка: применяем сохранённую тему до отрисовки.
     Тема по умолчанию (первый визит) — светлая. -->
<script>
(function(){
  try{
    var t = localStorage.getItem('fs-theme');
    if(!t){ t = 'light'; }
    document.documentElement.dataset.theme = t;
    document.getElementById('meta-theme').content = (t === 'light') ? '#F7F5F0' : '#0D182A';
  }catch(e){ document.documentElement.dataset.theme = 'light'; }
})();
</script>

<!-- Шрифты (Fontsource CDN) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/manrope@latest/cyrillic-400-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/manrope@latest/cyrillic-500-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/manrope@latest/cyrillic-600-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/manrope@latest/cyrillic-700-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/manrope@latest/cyrillic-800-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/manrope@latest/latin-400-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/manrope@latest/latin-700-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/playfair-display@latest/cyrillic-600-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/playfair-display@latest/cyrillic-700-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/playfair-display@latest/latin-600-normal.css">

<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="top-glow"></div>

<!-- ================= ШАПКА ================= -->
<header class="header">
  <div class="header-content">
    <div class="logo">
      <span class="logo-mark">
        <svg viewBox="0 0 24 24"><path d="M13 2 4.5 13.5H11L9.5 22 19 9.5h-6.5L13 2z"/></svg>
      </span>
      <span class="logo-text">
        <span class="logo-name">Быстрые смены</span>
        <span class="logo-tag">работа рядом</span>
      </span>
    </div>
    <div class="header-actions">
      <button class="theme-toggle" id="theme-toggle" aria-label="Переключить тему">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2.5M12 19.5V22M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2 12h2.5M19.5 12H22M4.2 19.8 6 18M18 6l1.8-1.8"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24">
          <path fill="currentColor" d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/>
        </svg>
      </button>
      <button class="city-btn" id="city-open-btn" aria-label="Выбрать город">
        <svg class="pin" viewBox="0 0 24 24"><path d="M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
        <span id="current-city">Казань</span>
        <svg class="chev" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5H7z" fill="currentColor"/></svg>
      </button>
    </div>
  </div>
</header>

<!-- ================= ПОДТВЕРЖДЕНИЕ ГОРОДА ================= -->
<div class="city-confirm" id="city-confirm">
  <div class="cc-inner">
    <div class="cc-text">
      <span class="cc-icon">
        <svg viewBox="0 0 24 24"><path d="M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
      </span>
      <span class="city-confirm-text">Определяем ваш город…</span>
    </div>
    <div class="cc-buttons">
      <button class="btn-yes" id="btn-city-yes">Да, верно</button>
      <button class="btn-no" id="btn-city-no">Изменить</button>
    </div>
  </div>
</div>

<!-- ================= ФИЛЬТРЫ ================= -->
<nav class="filters" id="filters" aria-label="Категории занятости">
  <button class="filter-btn active" data-filter="all">Все</button>
  <button class="filter-btn" data-filter="courier">Курьеры</button>
  <button class="filter-btn" data-filter="warehouse">Склады</button>
  <button class="filter-btn" data-filter="loader">Грузчики</button>
  <button class="filter-btn" data-filter="kitchen">Кухня</button>
  <button class="filter-btn" data-filter="promo">Промо</button>
</nav>

<!-- ================= ВАКАНСИИ ================= -->
<main class="jobs-container">
  <div class="jobs-header">
    <h1 class="jobs-title">Актуальные вакансии</h1>
    <span class="jobs-count" id="jobs-count">0 предложений</span>
  </div>
  <div class="jobs-grid" id="jobs-list"></div>
</main>

<!-- ================= ПОДВАЛ ================= -->
<footer class="footer">
  <span>Быстрые смены</span>
  <span class="footer-dot"></span>
  <span>© 2026</span>
</footer>

<!-- ================= МОДАЛКА ГОРОДА ================= -->
<div class="modal" id="city-modal" role="dialog" aria-modal="true" aria-label="Выбор города">
  <div class="modal-content">
    <button class="btn-close-modal" id="city-modal-close" aria-label="Закрыть">
      <svg viewBox="0 0 24 24"><path d="M19 6.4 17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12 19 6.4z"/></svg>
    </button>
    <div class="modal-title">Выберите ваш город</div>
    <div class="search-wrap">
      <input type="text" class="city-search" id="city-search" placeholder="Поиск города…" autocomplete="off">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.8l-.3-.3a6.5 6.5 0 1 0-.7.7l.3.3v.8l5 5 1.5-1.5-5-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
    </div>
    <div class="city-list" id="city-list"></div>
  </div>
</div>

<!-- ================= МОДАЛКА ВАКАНСИИ ================= -->
<div class="modal" id="job-modal" role="dialog" aria-modal="true" aria-label="Детали вакансии">
  <div class="modal-content" id="job-modal-content"></div>
</div>

<!-- ================= ТОСТ ================= -->
<div class="toast" id="toast">
  <svg viewBox="0 0 24 24"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"/></svg>
  <span id="toast-text"></span>
</div>

<script src="script.js"></script>
</body>
</html>
